<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>VisioOne Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="visioone.umd.cjs"></script>
</head>
<body>
  <div id="container"></div>
  <script>
    var visioOne = VisioOne.createVisioOne();
    var container = document.getElementById('container');
    var venue = null;
    var view = null;
    // Last POI targeted via goToPOI, so clearPOI knows which surfaces to
    // reset. See docs/features/goto-poi.md.
    var selectedPoi = null;

    // Finds a floor by ID across every building of the venue (floor IDs are
    // unique venue-wide, unlike POI IDs). See docs/features/floor-selector.md.
    function findFloorById(floorId) {
      if (!venue) return null;
      var buildings = venue.venueLayout.buildings;
      for (var i = 0; i < buildings.length; i++) {
        var floor = buildings[i].floors.find(function (f) { return f.id === floorId; });
        if (floor) return floor;
      }
      return null;
    }

    // JS -> native: pushes the full building/floor list plus what's
    // currently active, so the native bottom sheet can render a list and
    // highlight the selected floor. Sent once on `ready`, then again on
    // every `currentfloorchanged` (which also fires on a building switch,
    // since `view.goToBuilding` resolves to that building's default floor).
    // See docs/features/floor-selector.md.
    function sendFloorsState() {
      if (!venue || !view) return;
      var locale = venue.currentLocale;
      var buildings = venue.venueLayout.buildings.map(function (building) {
        var label = venue.translator.translateBuilding(building, locale).name || building.id;
        var floors = building.floors
          .slice()
          .sort(function (a, b) { return b.altitude - a.altitude; })
          .map(function (floor) {
            var shortName = venue.translator.translateFloor(floor, locale).shortName;
            return { id: floor.id, label: shortName || String(floor.levelIndex) };
          });
        return { id: building.id, label: label, floors: floors };
      });

      sendToNative('floorsChanged', {
        buildings: buildings,
        currentBuildingId: view.currentBuilding ? view.currentBuilding.id : null,
        currentFloorId: view.currentFloor ? view.currentFloor.id : null,
      });
    }

    // JS -> native: forward the loading lifecycle so the SwiftUI layer can
    // show a spinner/error instead of a screen frozen on a black rectangle.
    // See docs/APP_SDK_COMMUNICATION.md for the pattern.
    function sendToNative(type, message) {
      var handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mapBridge;
      if (!handler) {
        console.log('[VisioOne:web]', type, message);
        return;
      }
      handler.postMessage({ type: type, message: message });
    }

    // Native -> JS bridge: one method per command, called from Swift via
    // WKWebView.evaluateJavaScript(). Swift JSON-encodes arguments before
    // interpolating them into the generated script call, so what arrives
    // here is already a real JS value (array/object), never a string to
    // re-parse.
    window.MapBridge = {
      goToGlobal: function () {
        if (view) view.goToGlobal();
      },
      updateOccupancy: function (occupancy) {
        if (!venue) return;
        occupancy.forEach(function (entry) {
          var poi = venue.pois.find(function (p) { return p.id === entry.planId; });
          if (!poi) return;
          poi.surfaces.forEach(function (surface) {
            venue.updateSurface(surface, { color: entry.color });
          });
        });
      },
      // Centers/zooms the camera on a POI by ID and highlights its surfaces.
      // See docs/features/goto-poi.md.
      goToPOI: function (poiId) {
        if (!venue || !view) return;
        var poi = venue.pois.find(function (p) { return p.id === poiId; });
        if (!poi) return;

        if (selectedPoi) {
          selectedPoi.surfaces.forEach(function (surface) {
            venue.updateSurface(surface, { selectionColor: undefined });
          });
        }
        selectedPoi = poi;
        poi.surfaces.forEach(function (surface) {
          venue.updateSurface(surface, { selectionColor: '#057DBC' });
        });

        // The SDK docs for goToPOI are explicit: the caller must switch floor
        // first, otherwise the currentFloor/Building stays whatever it was.
        var floorChange = poi.floor ? view.goToFloor(poi.floor) : Promise.resolve();
        floorChange.then(function () {
          view.goToPOI(poi, {
            orientation: { pitch: 20 },
            padding: { top: 100, bottom: 100, right: 100, left: 100 },
          });
        });
      },
      // Resets the highlight left by goToPOI. Does not move the camera back
      // (see docs/features/goto-poi.md for why "Clear" isn't also "Reset view").
      clearPOI: function () {
        if (!venue || !selectedPoi) return;
        selectedPoi.surfaces.forEach(function (surface) {
          venue.updateSurface(surface, { selectionColor: undefined });
        });
        selectedPoi = null;
      },
      // Switches floor within the currently active building via
      // `view.goToFloor()`. See docs/features/floor-selector.md.
      goToFloor: function (floorId) {
        if (!venue || !view) return;
        var floor = findFloorById(floorId);
        if (!floor) return;
        view.goToFloor(floor);
      },
      // Switches building via `view.goToBuilding()`, which resolves to that
      // building's default floor. See docs/features/floor-selector.md.
      goToBuilding: function (buildingId) {
        if (!venue || !view) return;
        var building = venue.venueLayout.buildings.find(function (b) { return b.id === buildingId; });
        if (!building) return;
        view.goToBuilding(building);
      },
    };

    visioOne.loadVenue({ hash: 'kbae8e6c066cca4b02c2afac2bc963a643d87437a' }, container)
      .then(function (v) {
        venue = v;
        return visioOne.createView(container, venue);
      })
      .then(function (v) {
        view = v;

        // JS -> native: forward the SDK's `poiclick` event so the app can
        // react to a POI tap with a native panel (see docs/features/poi-click.md).
        // `event.pois` is the array of POIs under the tap point; only the
        // topmost one is relevant here.
        view.addEventListener('poiclick', function (event) {
          var poi = event.pois && event.pois[0];
          if (!poi) return;
          sendToNative('poiSelected', {
            id: poi.id,
            name: poi.labels && poi.labels.length ? poi.labels[0].text : null,
          });
        });

        // JS -> native: refresh the floor-selector state whenever the
        // active floor/building changes, whichever triggered it (native
        // goToFloor/goToBuilding calls below, the SDK's own default
        // floor-selector widget, or navigation). See docs/features/floor-selector.md.
        view.addEventListener('currentfloorchanged', function () {
          sendFloorsState();
        });

        sendToNative('ready');
        sendFloorsState();
      })
      .catch(function (error) {
        visioOne.showError(error, container);
        sendToNative('error', error && error.message ? error.message : String(error));
      });
  </script>
</body>
</html>
