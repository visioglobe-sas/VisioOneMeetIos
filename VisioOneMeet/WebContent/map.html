<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>VisioOne Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="visioone.umd.cjs"></script>
</head>
<body>
  <div id="container"></div>
  <script>
    var visioOne = VisioOne.createVisioOne();
    var container = document.getElementById('container');
    var venue = null;
    var view = null;
    // Last POI targeted via goToPOI, so clearPOI knows which surfaces to
    // reset. See docs/features/goto-poi.md.
    var selectedPoi = null;
    // Category id currently highlighted by highlightCategory, so a later
    // call knows which POIs' surfaces to revert first, and clearCategoryHighlight
    // knows what to undo. See docs/features/category-highlight.md.
    var highlightedCategoryId = null;

    // Finds a floor by ID across every building of the venue (floor IDs are
    // unique venue-wide, unlike POI IDs). See docs/features/floor-selector.md.
    function findFloorById(floorId) {
      if (!venue) return null;
      var buildings = venue.venueLayout.buildings;
      for (var i = 0; i < buildings.length; i++) {
        var floor = buildings[i].floors.find(function (f) { return f.id === floorId; });
        if (floor) return floor;
      }
      return null;
    }

    // JS -> native: pushes the full building/floor list plus what's
    // currently active, so the native bottom sheet can render a list and
    // highlight the selected floor. Sent once on `ready`, then again on
    // every `currentfloorchanged` (which also fires on a building switch,
    // since `view.goToBuilding` resolves to that building's default floor).
    // See docs/features/floor-selector.md.
    function sendFloorsState() {
      if (!venue || !view) return;
      var locale = venue.currentLocale;
      var buildings = venue.venueLayout.buildings.map(function (building) {
        var label = venue.translator.translateBuilding(building, locale).name || building.id;
        var floors = building.floors
          .slice()
          .sort(function (a, b) { return b.altitude - a.altitude; })
          .map(function (floor) {
            var shortName = venue.translator.translateFloor(floor, locale).shortName;
            return { id: floor.id, label: shortName || String(floor.levelIndex) };
          });
        return { id: building.id, label: label, floors: floors };
      });

      sendToNative('floorsChanged', {
        buildings: buildings,
        currentBuildingId: view.currentBuilding ? view.currentBuilding.id : null,
        currentFloorId: view.currentFloor ? view.currentFloor.id : null,
      });
    }

    // JS -> native: forward the loading lifecycle so the SwiftUI layer can
    // show a spinner/error instead of a screen frozen on a black rectangle.
    // See docs/APP_SDK_COMMUNICATION.md for the pattern.
    function sendToNative(type, message) {
      var handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mapBridge;
      if (!handler) {
        console.log('[VisioOne:web]', type, message);
        return;
      }
      handler.postMessage({ type: type, message: message });
    }

    // Native -> JS bridge: one method per command, called from Swift via
    // WKWebView.evaluateJavaScript(). Swift JSON-encodes arguments before
    // interpolating them into the generated script call, so what arrives
    // here is already a real JS value (array/object), never a string to
    // re-parse.
    window.MapBridge = {
      goToGlobal: function () {
        if (view) view.goToGlobal();
      },
      updateOccupancy: function (occupancy) {
        if (!venue) return;
        occupancy.forEach(function (entry) {
          var poi = venue.pois.find(function (p) { return p.id === entry.planId; });
          if (!poi) return;
          poi.surfaces.forEach(function (surface) {
            venue.updateSurface(surface, { color: entry.color });
          });
        });
      },
      // Centers/zooms the camera on a POI by ID and highlights its surfaces.
      // See docs/features/goto-poi.md.
      goToPOI: function (poiId) {
        if (!venue || !view) return;
        var poi = venue.pois.find(function (p) { return p.id === poiId; });
        if (!poi) return;

        if (selectedPoi) {
          selectedPoi.surfaces.forEach(function (surface) {
            venue.updateSurface(surface, { selectionColor: undefined });
          });
        }
        selectedPoi = poi;
        poi.surfaces.forEach(function (surface) {
          venue.updateSurface(surface, { selectionColor: '#057DBC' });
        });

        // The SDK docs for goToPOI are explicit: the caller must switch floor
        // first, otherwise the currentFloor/Building stays whatever it was.
        var floorChange = poi.floor ? view.goToFloor(poi.floor) : Promise.resolve();
        floorChange.then(function () {
          view.goToPOI(poi, {
            orientation: { pitch: 20 },
            padding: { top: 100, bottom: 100, right: 100, left: 100 },
          });
        });
      },
      // Resets the highlight left by goToPOI. Does not move the camera back
      // (see docs/features/goto-poi.md for why "Clear" isn't also "Reset view").
      clearPOI: function () {
        if (!venue || !selectedPoi) return;
        selectedPoi.surfaces.forEach(function (surface) {
          venue.updateSurface(surface, { selectionColor: undefined });
        });
        selectedPoi = null;
      },
      // Switches floor within the currently active building via
      // `view.goToFloor()`. See docs/features/floor-selector.md.
      goToFloor: function (floorId) {
        if (!venue || !view) return;
        var floor = findFloorById(floorId);
        if (!floor) return;
        view.goToFloor(floor);
      },
      // Switches building via `view.goToBuilding()`, which resolves to that
      // building's default floor. See docs/features/floor-selector.md.
      goToBuilding: function (buildingId) {
        if (!venue || !view) return;
        var building = venue.venueLayout.buildings.find(function (b) { return b.id === buildingId; });
        if (!building) return;
        view.goToBuilding(building);
      },
      // Computes a route between two POIs (by ID) and displays it via
      // view.setCurrentNavigationTrace(). That call replaces whatever route
      // was previously current on its own, so no manual cleanup is needed
      // between two calls. Errors thrown by computeNavigation (e.g. no
      // route found) propagate to the evaluateJavaScript completion
      // handler on the Swift side rather than being caught here — see
      // docs/features/compute-navigation.md.
      computeNavigation: function (request) {
        if (!venue || !view) return;
        var navigation = venue.computeNavigation({
          origin: request.origin,
          destination: request.destination,
          isAccessible: request.isAccessible,
          type: 'fastest',
          firstNodeAsIntersection: false,
          mergeFloorChangeInstructions: false,
        });
        var navigationTrace = venue.createNavigationTrace(navigation);
        view.setCurrentNavigationTrace(navigationTrace);
      },
      // Shows/hides one of the SDK's own default UI overlays via
      // view.setUIPartVisible(). uiPart is one of exactly 5 case-sensitive
      // string values ('floorSelector', 'navigation', 'poiDetails',
      // 'search', 'userTracking') — no validation here, an unknown value is
      // simply ignored by the SDK. See docs/features/ui-part-visibility.md.
      setUIPartVisible: function (uiPart, isVisible) {
        if (!view) return;
        view.setUIPartVisible(uiPart, isVisible);
      },
      // Resolves a POI's WGS84 position by ID, read from its first marker,
      // label, or image (POIs have no direct lat/lng field of their own).
      // Returns null for an unknown POI id or one with none of those three
      // sub-objects — both are "POI not found" to the native caller. Unlike
      // the other MapBridge methods, this one is read straight from
      // evaluateJavaScript's return value on the Swift side rather than
      // pushed back via sendToNative, since it's a synchronous lookup with
      // no event to react to. See docs/features/simulated-position.md.
      resolvePoiPosition: function (poiId) {
        if (!venue) return null;
        var poi = venue.pois.find(function (p) { return p.id === poiId; });
        if (!poi) return null;
        var position =
          (poi.markers && poi.markers[0] && poi.markers[0].position) ||
          (poi.labels && poi.labels[0] && poi.labels[0].position) ||
          (poi.images && poi.images[0] && poi.images[0].position);
        if (!position) return null;
        return { latitude: position.latitude, longitude: position.longitude };
      },
      // Injects/updates the simulated tracked position + accuracy circle.
      // allowTracking must be true before the first injectTrackedPosition
      // call, so it's set here on every call rather than requiring a
      // separate "start" step. See docs/features/simulated-position.md.
      injectTrackedPosition: function (latitude, longitude, precisionCircleRadius) {
        if (!view) return;
        view.allowTracking = true;
        view.injectTrackedPosition({
          position: { latitude: latitude, longitude: longitude },
          precisionCircleRadius: precisionCircleRadius,
        });
      },
      // Removes the simulated marker/accuracy circle. The SDK has no
      // dedicated stop method — this is what allowTracking = false is for.
      // See docs/features/simulated-position.md.
      stopTrackedPosition: function () {
        if (!view) return;
        view.allowTracking = false;
      },
      // Locks/unlocks the camera onto the currently tracked position via
      // view.lockCameraPositionOnTracking. Only has a visible effect once
      // view.allowTracking is already true (i.e. a tracked position is
      // being injected, see injectTrackedPosition above) — per the SDK's
      // own doc comment, setting this while tracking is off is a harmless
      // no-op, not an error, so no guard is needed here. See
      // docs/features/camera-lock-on-position.md.
      setCameraLockOnPosition: function (locked) {
        if (!view) return;
        view.lockCameraPositionOnTracking = locked;
      },
      // Makes a POI's surface(s) clickable via venue.updateSurface()'s
      // isInteractive option — the SDK itself then handles the hover/tap
      // color swap (hoverColor/selectionColor), no click listener needed on
      // either side of the bridge for that part. Disabling resets the base
      // color to 'initial' so the surface doesn't stay stuck on the custom
      // color set here. See docs/features/clickable-surface.md.
      setSurfaceInteractive: function (placeId, isInteractive) {
        if (!venue) return;
        var poi = venue.pois.find(function (p) { return p.id === placeId; });
        if (!poi) return;
        poi.surfaces.forEach(function (surface) {
          venue.updateSurface(
            surface,
            isInteractive
              ? { isInteractive: true, color: '#2ECC71', hoverColor: '#F1C40F', selectionColor: '#E74C3C' }
              : { isInteractive: false, color: 'initial' }
          );
        });
      },
      // Reads a POI's business CustomData (free key/value strings such as
      // price, opening hours, product reference), set in VisioMapEditor.
      // venue.refreshCustomData() is never called automatically on load --
      // the cache starts empty ({}) until this resolves at least once, so
      // it's awaited here before every lookup. venue.getPOICustomData() is
      // synchronous and always returns an object (never null/undefined),
      // {} when the POI has no CustomData. This is the only MapBridge
      // method that awaits a promise before returning, so it's called from
      // Swift via callAsyncJavaScript rather than a plain
      // evaluateJavaScript string. See docs/features/custom-data.md.
      //
      // refreshCustomData() rejects (rather than resolving) when the venue
      // has no CustomData published yet -- e.g. a 404 on its customData.json
      // surfaces here as an "Error: Hash not found" rejection, confirmed
      // live against this repo's demo map. That's a normal "nothing to
      // load yet" outcome, not a real failure, so it's swallowed here and
      // the lookup proceeds against whatever the (possibly still-empty)
      // cache holds, rather than propagating as a WKJavaScriptExceptionMessage
      // failure to the Swift side. See docs/features/custom-data.md.
      loadCustomData: async function (poiId) {
        if (!venue) return { found: false };
        try {
          await venue.refreshCustomData();
        } catch (e) {
          // Intentionally ignored -- see comment above.
        }
        var poi = venue.pois.find(function (p) { return p.id === poiId; });
        if (!poi) return { found: false };
        return { found: true, data: venue.getPOICustomData(poi) };
      },
      // Returns the venue's full category list (venue.categories: Category[],
      // Category = { readonly id: string }) so the native side can render a
      // picker. A synchronous read of data the SDK already loaded with the
      // venue -- no promise involved, unlike loadCustomData above -- so this
      // is read straight from evaluateJavaScript's return value on the Swift
      // side, same idiom as resolvePoiPosition. See
      // docs/features/category-highlight.md.
      //
      // category.id is a raw internal identifier (a numeric string on this
      // demo's shared map, e.g. "1".."11"), not itself human-readable --
      // confirmed live, contrary to what's assumed elsewhere. The
      // human-readable name comes from venue.translator.translateCategory(),
      // same idiom sendFloorsState() already uses for building/floor labels
      // above. Both id (used for filtering/highlighting) and label (used for
      // display only) are returned so the native side never needs to
      // highlight by a translated string.
      getCategories: function () {
        if (!venue) return [];
        var locale = venue.currentLocale;
        return venue.categories.map(function (c) {
          var translated = venue.translator.translateCategory(c, locale);
          return { id: c.id, label: (translated && translated.name) || c.id };
        });
      },
      // Highlights every POI belonging to categoryId by setting its
      // surface(s)' color, built from venue.pois.filter() (no dedicated
      // "highlight by category" SDK method exists) + venue.updateSurface().
      // Only one category is highlighted at a time: whatever was highlighted
      // before (tracked in highlightedCategoryId) is reverted to 'initial'
      // first. POIs with no surfaces (point/marker-only) are filtered in but
      // simply produce no visible change, since poi.surfaces is []. See
      // docs/features/category-highlight.md.
      highlightCategory: function (categoryId) {
        if (!venue) return;
        if (highlightedCategoryId) {
          venue.pois
            .filter(function (p) { return p.categories.some(function (c) { return c.id === highlightedCategoryId; }); })
            .forEach(function (poi) {
              poi.surfaces.forEach(function (surface) { venue.updateSurface(surface, { color: 'initial' }); });
            });
        }
        highlightedCategoryId = categoryId;
        venue.pois
          .filter(function (p) { return p.categories.some(function (c) { return c.id === categoryId; }); })
          .forEach(function (poi) {
            poi.surfaces.forEach(function (surface) { venue.updateSurface(surface, { color: '#FF6B00' }); });
          });
      },
      // Reverts whatever highlightCategory last applied. Passing 'initial'
      // (not undefined) is required to actually restore the bundle-defined
      // color -- see docs/features/category-highlight.md.
      clearCategoryHighlight: function () {
        if (!venue || !highlightedCategoryId) return;
        venue.pois
          .filter(function (p) { return p.categories.some(function (c) { return c.id === highlightedCategoryId; }); })
          .forEach(function (poi) {
            poi.surfaces.forEach(function (surface) { venue.updateSurface(surface, { color: 'initial' }); });
          });
        highlightedCategoryId = null;
      },
    };

    // Optional override so a single feature screen (custom-data, which
    // needs a map with published CustomData the shared demo map doesn't
    // have) can point this same bundled page at a different map without
    // touching the default used by every other feature. Mirrors the
    // `?hash=` query-param pattern already used by the Android sibling app
    // (see web/src/main.js there) -- MapWebView.swift appends it to the
    // file:// URL only when instantiated for that feature, nil/omitted
    // otherwise. See docs/features/custom-data.md.
    var DEFAULT_HASH = 'kbae8e6c066cca4b02c2afac2bc963a643d87437a';
    var hash = new URLSearchParams(window.location.search).get('hash') || DEFAULT_HASH;

    visioOne.loadVenue({ hash: hash }, container)
      .then(function (v) {
        venue = v;
        return visioOne.createView(container, venue);
      })
      .then(function (v) {
        view = v;

        // JS -> native: forward the SDK's `poiclick` event so the app can
        // react to a POI tap with a native panel (see docs/features/poi-click.md).
        // `event.pois` is the array of POIs under the tap point; only the
        // topmost one is relevant here.
        view.addEventListener('poiclick', function (event) {
          var poi = event.pois && event.pois[0];
          if (!poi) return;
          sendToNative('poiSelected', {
            id: poi.id,
            name: poi.labels && poi.labels.length ? poi.labels[0].text : null,
          });
        });

        // JS -> native: refresh the floor-selector state whenever the
        // active floor/building changes, whichever triggered it (native
        // goToFloor/goToBuilding calls below, the SDK's own default
        // floor-selector widget, or navigation). See docs/features/floor-selector.md.
        view.addEventListener('currentfloorchanged', function () {
          sendFloorsState();
        });

        sendToNative('ready');
        sendFloorsState();
      })
      .catch(function (error) {
        visioOne.showError(error, container);
        sendToNative('error', error && error.message ? error.message : String(error));
      });
  </script>
</body>
</html>
